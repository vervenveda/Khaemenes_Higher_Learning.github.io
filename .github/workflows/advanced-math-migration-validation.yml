name: Higher Learning Advanced Mathematics Migration

on:
  push:
    branches: [main]
    paths:
      - 'courses/mathematics/**'
      - 'tools/validate-higher-math-handoff-records.mjs'
      - 'tools/validate-higher-math-college-core-chain.mjs'
      - 'tools/validate-higher-math-proof-sequence.mjs'
      - 'tools/validate-higher-math-advanced-geometry-boundary.mjs'
      - 'tools/validate-higher-math-landing-engine-rollout.mjs'
      - 'tools/validate-higher-learning-clean-course-navigation.mjs'
      - 'tools/validate-higher-math-execution-matrix.mjs'
      - 'courses/advanced-geometric-topology/**'
      - 'courses/topology-differential-geometry/**'
      - 'courses/real-complex-analysis/**'
      - 'courses/abstract-algebra/**'
      - 'courses/statistics/**'
      - 'courses/linear-algebra/**'
      - 'courses/introduction-to-proofs/**'
      - 'courses/discrete-mathematics/**'
      - 'courses/differential-equations/**'
      - 'courses/calculus-ii/**'
      - 'courses/mathematics-execution-matrix-v1.json'
      - 'courses/shared/**'
      - 'tools/validate-advanced-math-migration.mjs'
      - '.github/workflows/advanced-math-migration-validation.yml'
      - 'index-core.txt'
  pull_request:
    paths:
      - 'courses/mathematics/**'
      - 'courses/shared/**'
      - 'tools/validate-advanced-math-migration.mjs'
      - '.github/workflows/advanced-math-migration-validation.yml'
      - 'index-core.txt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate advanced mathematics migration
        run: node tools/validate-advanced-math-migration.mjs
      - name: Validate mathematics continuum authority
        run: node tools/validate-higher-math-execution-matrix.mjs
      - name: Validate Precalculus and Calculus I handoff records
        run: node tools/validate-higher-math-handoff-records.mjs
      - name: Validate College Core mathematics chain
        run: node tools/validate-higher-math-college-core-chain.mjs
      - name: Validate proof-based mathematics sequence
        run: node tools/validate-higher-math-proof-sequence.mjs
      - name: Validate advanced geometry hybrid boundary
        run: node tools/validate-higher-math-advanced-geometry-boundary.mjs
      - name: Validate canonical Higher Learning math landings and lesson engine
        run: node tools/validate-higher-math-landing-engine-rollout.mjs
      - name: Validate clean Higher Learning course navigation topology
        run: node tools/validate-higher-learning-clean-course-navigation.mjs
