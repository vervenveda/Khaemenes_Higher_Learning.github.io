name: Higher Learning Global Standard

on:
  push:
    branches: [main]
    paths:
      - 'assets/higher-learning-global-standard-v1.js'
      - 'tools/higher-learning-global-standard-audit.mjs'
      - '.github/workflows/higher-learning-global-standard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Higher Learning typography and chrome authority
        run: node tools/higher-learning-global-standard-audit.mjs --write
      - name: Verify Higher Learning global standard coverage
        run: node tools/higher-learning-global-standard-audit.mjs --check
      - name: Validate patch
        run: git diff --check
      - name: Commit normalization
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Higher Learning pages required global-standard repair."
            exit 0
          fi
          git config user.name "Khaemenes Academy Automation"
          git config user.email "khaemenesacademy@users.noreply.github.com"
          git add -A -- ':!node_modules' ':!.git'
          git commit -m "Standardize Higher Learning global chrome and typography"
          git push
