name: Higher Learning Mentor Bridge Validation

on:
  pull_request:
    paths:
      - 'assets/khaemenes-higher-learning-bridge.js'
      - 'start/index.html'
      - 'mentor/index.html'
      - 'tools/validate-higher-learning-mentor-bridge.mjs'
      - '.github/workflows/higher-learning-mentor-bridge-validation.yml'
  push:
    branches: [ main ]
    paths:
      - 'assets/khaemenes-higher-learning-bridge.js'
      - 'start/index.html'
      - 'mentor/index.html'
      - 'tools/validate-higher-learning-mentor-bridge.mjs'
      - '.github/workflows/higher-learning-mentor-bridge-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check bridge syntax
        run: node --check assets/khaemenes-higher-learning-bridge.js
      - name: Validate mentor integration
        run: node tools/validate-higher-learning-mentor-bridge.mjs
