name: Higher Learning Mathematics Minimal Landings

on:
  push:
    branches: [main]
    paths:
      - 'courses/mathematics/precalculus-trigonometry/index.html'
      - 'courses/mathematics/calculus-1/index.html'
      - 'courses/calculus-ii/index.html'
      - 'courses/linear-algebra/index.html'
      - 'courses/differential-equations/index.html'
      - 'courses/statistics/index.html'
      - 'courses/discrete-mathematics/index.html'
      - 'courses/introduction-to-proofs/index.html'
      - 'courses/real-complex-analysis/index.html'
      - 'courses/abstract-algebra/index.html'
      - 'courses/topology-differential-geometry/index.html'
      - 'courses/advanced-geometric-topology/index.html'
      - 'assets/higher-math-minimal-landing-v1.css'
      - 'assets/higher-math-minimal-header-mount-v1.js'
      - 'assets/higher-math-landing-class-tools-v1.js'
      - 'assets/higher-learning-global-standard-v1.js'
      - 'tools/validate-higher-math-minimal-landings.mjs'
      - '.github/workflows/higher-math-minimal-landings.yml'
  pull_request:
    paths:
      - 'courses/**/index.html'
      - 'assets/higher-math-*'
      - 'tools/validate-higher-math-minimal-landings.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 12 Higher Learning mathematics landing pages
        run: node tools/validate-higher-math-minimal-landings.mjs
      - name: Validate patch formatting
        run: git diff --check
