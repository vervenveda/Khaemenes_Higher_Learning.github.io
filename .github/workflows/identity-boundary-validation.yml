name: Higher Learning Identity Boundary

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-identity-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Validate Higher Learning learner authority
        run: node tools/validate-higher-learning-identity-boundary.mjs
