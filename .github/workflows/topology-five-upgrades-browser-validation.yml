name: Higher Learning Topology Browser Validation
on:
  pull_request:
    paths:
      - 'courses/topology-differential-geometry/**'
      - 'tests/test_topology_upgrade_browser.py'
      - '.github/workflows/topology-five-upgrades-browser-validation.yml'
  push:
    branches: [main]
    paths:
      - 'courses/topology-differential-geometry/**'
      - 'tests/test_topology_upgrade_browser.py'
      - '.github/workflows/topology-five-upgrades-browser-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium
      - name: Run topology learner and mobile regression checks
        run: python -m pytest -v tests/test_topology_upgrade_browser.py
