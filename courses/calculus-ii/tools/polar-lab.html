<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{--bg:#07111d;--panel:#122236;--ink:#f4f7fa;--muted:#aeb9c5;--bronze:#d9c7a6;--line:#30445a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#07111d,#122236);color:var(--ink);font:16px/1.55 system-ui;padding:24px}.shell{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:320px 1fr;gap:18px}.card{padding:18px;border:1px solid var(--line);border-radius:17px;background:rgba(18,34,54,.9)}label{display:grid;gap:5px;margin:11px 0;color:var(--muted)}input,select,button{min-height:42px;border:1px solid var(--line);border-radius:9px;background:#07111d;color:var(--ink);padding:8px}button{background:var(--bronze);color:#07111d;font-weight:700}canvas{width:100%;height:540px;background:white;border-radius:13px}h1{font-family:Georgia,serif;font-weight:400}@media(max-width:800px){.grid{grid-template-columns:1fr}canvas{height:420px}}</style><title>Polar Curve Lab</title></head><body><div class="shell"><h1>Polar Curve Lab</h1><p>Plot canonical polar families and inspect radial symmetry, periodicity, loops, and petals.</p><div class="grid"><div class="card"><label>Family<select id="type"><option value="rose">Rose r=a cos(kθ)</option><option value="card">Cardioid r=a(1+cosθ)</option><option value="lima">Limaçon r=a+b cosθ</option><option value="spiral">Spiral r=a+bθ</option><option value="circle">Circle r=a cosθ</option></select></label><label>a<input id="a" type="number" value="2" step=".1"></label><label>b or k<input id="b" type="number" value="3" step=".1"></label><button id="run">Plot</button><div id="out"></div></div><canvas id="c" width="760" height="540"></canvas></div></div><script>const $=s=>document.querySelector(s),c=$('#c'),g=c.getContext('2d');function run(){let t=$('#type').value,a=+$('[id=a]').value,b=+$('[id=b]').value,pts=[],maxr=1;for(let i=0;i<=1600;i++){let th=8*Math.PI*i/1600,r=t==='rose'?a*Math.cos(b*th):t==='card'?a*(1+Math.cos(th)):t==='lima'?a+b*Math.cos(th):t==='spiral'?a+b*th/(2*Math.PI):a*Math.cos(th);maxr=Math.max(maxr,Math.abs(r));pts.push([r*Math.cos(th),r*Math.sin(th)])}g.clearRect(0,0,c.width,c.height);let s=.43*Math.min(c.width,c.height)/maxr,X=x=>c.width/2+x*s,Y=y=>c.height/2-y*s;g.strokeStyle='#ddd';g.beginPath();g.moveTo(0,c.height/2);g.lineTo(c.width,c.height/2);g.moveTo(c.width/2,0);g.lineTo(c.width/2,c.height);g.stroke();g.strokeStyle='#55688e';g.lineWidth=3;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(X(p[0]),Y(p[1])):g.moveTo(X(p[0]),Y(p[1])));g.stroke();$('#out').innerHTML='<p>Inspect symmetry under θ→−θ and θ→π−θ. For area, identify a non-overlapping interval before using ½∫r²dθ.</p>'}$('#run').onclick=run;run()</script></body></html>
