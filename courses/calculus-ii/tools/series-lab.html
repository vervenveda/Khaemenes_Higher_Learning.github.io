<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{--bg:#07111d;--panel:#122236;--ink:#f4f7fa;--muted:#aeb9c5;--bronze:#d9c7a6;--line:#30445a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#07111d,#122236);color:var(--ink);font:16px/1.55 system-ui;padding:24px}.shell{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:320px 1fr;gap:18px}.card{padding:18px;border:1px solid var(--line);border-radius:17px;background:rgba(18,34,54,.9)}label{display:grid;gap:5px;margin:11px 0;color:var(--muted)}input,select,button{min-height:42px;border:1px solid var(--line);border-radius:9px;background:#07111d;color:var(--ink);padding:8px}button{background:var(--bronze);color:#07111d;font-weight:700}canvas{width:100%;height:540px;background:white;border-radius:13px}h1{font-family:Georgia,serif;font-weight:400}@media(max-width:800px){.grid{grid-template-columns:1fr}canvas{height:420px}}</style><title>Series and Convergence Lab</title></head><body><div class="shell"><h1>Series &amp; Convergence Lab</h1><p>Explore term size and partial sums. A term approaching zero is necessary but not sufficient for convergence.</p><div class="grid"><div class="card"><label>Series<select id="type"><option value="geo">Geometric a·rⁿ</option><option value="p">p-series 1/nᵖ</option><option value="alt">Alternating harmonic</option><option value="taylor">eˣ Maclaurin at x</option></select></label><label>Parameter r, p, or x<input id="param" type="number" value="0.5" step=".1"></label><label>Terms<input id="N" type="number" value="20" min="2" max="200"></label><button id="run">Recalculate</button><div id="out"></div></div><canvas id="c" width="760" height="540"></canvas></div></div><script>const $=s=>document.querySelector(s),c=$('#c'),g=c.getContext('2d');function run(){let t=$('#type').value,p=+$('[id=param]').value,N=Math.max(2,+$('[id=N]').value),sum=0,pts=[];for(let n=0;n<N;n++){let a=t==='geo'?Math.pow(p,n):t==='p'?1/Math.pow(n+1,p):t==='alt'?Math.pow(-1,n)/(n+1):Math.pow(p,n)/fact(n);sum+=a;pts.push(sum)}let expected=t==='geo'&&Math.abs(p)<1?1/(1-p):t==='taylor'?Math.exp(p):null;$('#out').innerHTML=`<p>Partial sum S_${N} = ${sum.toFixed(10)}</p><p>${expected!==null?'Reference limit: '+expected.toFixed(10)+' · error '+Math.abs(sum-expected).toExponential(2):'Use the graph and the appropriate convergence test.'}</p>`;g.clearRect(0,0,c.width,c.height);let mn=Math.min(...pts,0),mx=Math.max(...pts,1),X=i=>30+i/(N-1)*(c.width-60),Y=y=>c.height-30-(y-mn)/(mx-mn||1)*(c.height-60);g.strokeStyle='#ddd';for(let i=0;i<8;i++){g.beginPath();g.moveTo(0,i*c.height/8);g.lineTo(c.width,i*c.height/8);g.stroke()}g.strokeStyle='#2d7f88';g.lineWidth=3;g.beginPath();pts.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.stroke();g.fillStyle='#55688e';pts.forEach((v,i)=>{g.beginPath();g.arc(X(i),Y(v),3,0,7);g.fill()})}function fact(n){let r=1;for(let i=2;i<=n;i++)r*=i;return r}$('#run').onclick=run;run()</script></body></html>
