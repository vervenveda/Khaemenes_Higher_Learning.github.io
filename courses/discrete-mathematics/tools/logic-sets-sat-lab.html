<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark light"><meta name="theme-color" content="#090b10"><meta name="description" content="Khaemenes Higher Learning Discrete Mathematics."><meta name="application-version" content="2026.08.07-discrete-mathematics-1"><title>Logic, Sets &amp; SAT Lab</title><link rel="stylesheet" href="../assets/styles.css?v=discrete-mathematics-1"></head><body><a class="skip screen-only" href="#main">Skip to main content</a><header class="site-header screen-only"><div class="wrap header-inner"><div class="brand-group"><a class="brand-home" href="https://vervenveda.com/Khaemenes_Higher_Learning.github.io/" aria-label="Khaemenes Higher Learning home">K</a><a class="brand-copy" href="../index.html"><strong>Logic, Sets &amp; SAT Lab</strong><small>Truth tables · Set operations · Satisfiability foundations</small></a></div><div class="header-tools"><a class="header-control" href="../index.html">Course Home</a><a class="header-control" href="../records/learner-profile.html">Profile</a><button class="header-control" id="themeToggle" type="button">◐ Theme</button><button class="header-control" onclick="window.print()" type="button">Print / Save PDF</button></div></div></header><main class="section" id="main"><div class="wrap"><div class="section-head"><p class="eyebrow">Interactive logic laboratory</p><h2>Logic, Sets &amp; SAT Lab</h2><p>Generate truth tables, compare equivalent forms, evaluate set operations, and test small conjunctive-normal-form formulas.</p></div><div class="lab-grid"><section class="lab-panel"><label>Formula preset<select id="formula"><option value="imp">p → q</option><option value="demorgan">¬(p ∧ q) ↔ (¬p ∨ ¬q)</option><option value="xor">(p ∨ q) ∧ ¬(p ∧ q)</option><option value="three">(p → q) ∧ (q → r) → (p → r)</option></select></label><label>Set A<input id="setA" value="1,2,3,5"></label><label>Set B<input id="setB" value="3,4,5,6"></label><div class="actions"><button class="btn primary" id="runLogic">Build Truth Table</button><button class="btn" id="runSets">Evaluate Sets</button></div></section><aside class="lab-panel"><div id="logicOutput" class="result-box"></div><pre id="setOutput" class="result-box"></pre></aside></div></div></main><script>(()=>{"use strict";const $=id=>document.getElementById(id);function tf(x){return x?"T":"F"}function runLogic(){const mode=$("formula").value,rows=[],vals=[true,false];if(mode==="three"){for(const p of vals)for(const q of vals)for(const r of vals){const out=(!((!p||q)&&(!q||r)))||(!p||r);rows.push([p,q,r,out])}$("logicOutput").innerHTML='<table class="truth-table"><tr><th>p</th><th>q</th><th>r</th><th>value</th></tr>'+rows.map(x=>`<tr>${x.map(v=>`<td>${tf(v)}</td>`).join("")}</tr>`).join("")+'</table>';return}for(const p of vals)for(const q of vals){let out;if(mode==="imp")out=!p||q;else if(mode==="demorgan")out=(!(p&&q))===(!p||!q);else out=(p||q)&&!(p&&q);rows.push([p,q,out])}$("logicOutput").innerHTML='<table class="truth-table"><tr><th>p</th><th>q</th><th>value</th></tr>'+rows.map(x=>`<tr>${x.map(v=>`<td>${tf(v)}</td>`).join("")}</tr>`).join("")+'</table>'}function parse(id){return [...new Set($(id).value.split(/[\s,]+/).filter(Boolean))].sort()}function runSets(){const A=parse("setA"),B=parse("setB"),S=new Set(B),T=new Set(A),union=[...new Set([...A,...B])].sort(),inter=A.filter(x=>S.has(x)),diff=A.filter(x=>!S.has(x)),sym=union.filter(x=>!(S.has(x)&&T.has(x)));$("setOutput").textContent=`A = {${A.join(', ')}}\nB = {${B.join(', ')}}\nA ∪ B = {${union.join(', ')}}\nA ∩ B = {${inter.join(', ')}}\nA \\ B = {${diff.join(', ')}}\nA △ B = {${sym.join(', ')}}\n|P(A)| = ${2**A.length}`}$('runLogic').onclick=runLogic;$('runSets').onclick=runSets;$('themeToggle').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';runLogic();runSets()})();</script></body></html>
