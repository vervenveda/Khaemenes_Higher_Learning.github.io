<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{--bg:#07111d;--panel:#122236;--ink:#f4f7fa;--muted:#aeb9c5;--bronze:#d9c7a6;--line:#30445a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#07111d,#122236);color:var(--ink);font:16px/1.55 system-ui;padding:24px}.shell{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:320px 1fr;gap:18px}.card{padding:18px;border:1px solid var(--line);border-radius:17px;background:rgba(18,34,54,.9)}label{display:grid;gap:5px;margin:11px 0;color:var(--muted)}input,select,button{min-height:42px;border:1px solid var(--line);border-radius:9px;background:#07111d;color:var(--ink);padding:8px}button{background:var(--bronze);color:#07111d;font-weight:700}canvas{width:100%;height:540px;background:white;border-radius:13px}h1{font-family:Georgia,serif;font-weight:400}@media(max-width:800px){.grid{grid-template-columns:1fr}canvas{height:420px}}</style><title>Integration Methods Lab</title></head><body><div class="shell"><h1>Integration Methods Lab</h1><p>Compare midpoint, trapezoidal, and Simpson approximations for a polynomial integrand. Refine n and inspect error against the exact antiderivative.</p><div class="grid"><div class="card"><label>Function<select id="fn"><option value="x2">x²</option><option value="x3">x³−2x+2</option><option value="quartic">x⁴−2x²+1</option></select></label><label>Lower bound<input id="a" type="number" value="0" step=".1"></label><label>Upper bound<input id="b" type="number" value="2" step=".1"></label><label>Even subintervals<input id="n" type="number" value="8" min="2" step="2"></label><button id="run">Recalculate</button><div id="out"></div></div><canvas id="c" width="760" height="540"></canvas></div></div><script>const $=s=>document.querySelector(s),c=$('#c'),g=c.getContext('2d');function f(x){return $('#fn').value==='x2'?x*x:$('#fn').value==='x3'?x*x*x-2*x+2:Math.pow(x,4)-2*x*x+1}function F(x){return $('#fn').value==='x2'?x*x*x/3:$('#fn').value==='x3'?Math.pow(x,4)/4-x*x+2*x:Math.pow(x,5)/5-2*Math.pow(x,3)/3+x}function run(){let a=+$('[id=a]').value,b=+$('[id=b]').value,n=Math.max(2,Math.round(+$('[id=n]').value/2)*2),h=(b-a)/n;let mid=0,trap=(f(a)+f(b))/2,simp=f(a)+f(b);for(let i=0;i<n;i++)mid+=f(a+(i+.5)*h);for(let i=1;i<n;i++){trap+=f(a+i*h);simp+=(i%2?4:2)*f(a+i*h)}mid*=h;trap*=h;simp*=h/3;let exact=F(b)-F(a);$('#out').innerHTML=`<p>Exact: ${exact.toFixed(8)}</p><p>Midpoint: ${mid.toFixed(8)} · error ${Math.abs(mid-exact).toExponential(2)}</p><p>Trapezoid: ${trap.toFixed(8)} · error ${Math.abs(trap-exact).toExponential(2)}</p><p>Simpson: ${simp.toFixed(8)} · error ${Math.abs(simp-exact).toExponential(2)}</p>`;g.clearRect(0,0,c.width,c.height);g.strokeStyle='#ddd';for(let i=0;i<10;i++){g.beginPath();g.moveTo(0,i*c.height/10);g.lineTo(c.width,i*c.height/10);g.stroke()}let vals=[];for(let i=0;i<=300;i++)vals.push(f(a+(b-a)*i/300));let mn=Math.min(0,...vals),mx=Math.max(1,...vals),X=x=>(x-a)/(b-a)*c.width,Y=y=>c.height-(y-mn)/(mx-mn)*c.height;g.fillStyle='rgba(85,104,142,.25)';g.beginPath();g.moveTo(X(a),Y(0));vals.forEach((v,i)=>g.lineTo(i*c.width/300,Y(v)));g.lineTo(X(b),Y(0));g.closePath();g.fill();g.strokeStyle='#2d7f88';g.lineWidth=4;g.beginPath();vals.forEach((v,i)=>i?g.lineTo(i*c.width/300,Y(v)):g.moveTo(0,Y(v)));g.stroke()}$('#run').onclick=run;run()</script></body></html>
