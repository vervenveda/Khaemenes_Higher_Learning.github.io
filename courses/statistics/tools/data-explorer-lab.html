<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark light"><meta name="theme-color" content="#090b10"><meta name="description" content="Khaemenes Higher Learning Statistics."><meta name="application-version" content="2026.08.07-statistics-1"><title>Data Explorer &amp; Distribution Lab</title><link rel="stylesheet" href="../assets/styles.css?v=statistics-1"></head><body><a class="skip screen-only" href="#main">Skip to main content</a><header class="site-header screen-only"><div class="wrap header-inner"><div class="brand-group"><a class="brand-home" href="https://vervenveda.com/Khaemenes_Higher_Learning.github.io/" aria-label="Khaemenes Higher Learning home">K</a><a class="brand-copy" href="../index.html"><strong>Data Explorer &amp; Distribution Lab</strong><small>Center · Spread · Shape · Outliers</small></a></div><div class="header-tools"><a class="header-control" href="../index.html">Course Home</a><a class="header-control" href="../records/learner-profile.html">Profile</a><button class="header-control" id="themeToggle" type="button">◐ Theme</button><button class="header-control" onclick="window.print()" type="button">Print / Save PDF</button></div></div></header><main class="section" id="main"><div class="wrap"><div class="section-head"><p class="eyebrow">Interactive data laboratory</p><h2>Data Explorer &amp; Distribution Lab</h2><p>Enter comma-separated values. Inspect center, spread, quartiles, outliers, and a live histogram.</p></div><div class="lab-grid"><section class="lab-panel"><label>Data<textarea id="dataInput" class="dataset-input">4,5,6,7,8,8,9,10,11,12,13,15,18,28</textarea></label><div class="actions"><button class="btn primary" id="analyze">Analyze</button><button class="btn" id="normalPreset">Normal-ish</button><button class="btn" id="skewPreset">Right-skewed</button><button class="btn" id="outlierPreset">Outlier</button></div><div id="metrics" class="metric-grid"></div></section><aside class="lab-panel"><svg id="hist" class="lab-canvas" viewBox="0 0 640 360" aria-label="Histogram"></svg><pre id="report" class="result-box"></pre></aside></div></div></main><script>(()=>{"use strict";const $=id=>document.getElementById(id),svg=$("hist"),rep=$("report"),metrics=$("metrics");function vals(){return $("dataInput").value.split(/[\s,]+/).map(Number).filter(Number.isFinite)}function q(a,p){const x=(a.length-1)*p,i=Math.floor(x),r=x-i;return a[i]+(a[Math.min(i+1,a.length-1)]-a[i])*r}function analyze(){const a=vals().sort((x,y)=>x-y);if(!a.length)return;const n=a.length,mean=a.reduce((s,x)=>s+x,0)/n,med=q(a,.5),q1=q(a,.25),q3=q(a,.75),iqr=q3-q1,sd=Math.sqrt(a.reduce((s,x)=>s+(x-mean)**2,0)/(n-1||1)),lo=q1-1.5*iqr,hi=q3+1.5*iqr,out=a.filter(x=>x<lo||x>hi),min=a[0],max=a[n-1],bins=Math.max(4,Math.min(10,Math.ceil(Math.sqrt(n)))),w=(max-min||1)/bins,c=Array(bins).fill(0);a.forEach(x=>c[Math.min(bins-1,Math.floor((x-min)/(w||1)))]++);const W=560,H=250,mx=Math.max(...c,1);let h='<rect width="640" height="360" fill="#fff"/><line x1="45" y1="300" x2="610" y2="300" stroke="#555"/><line x1="45" y1="40" x2="45" y2="300" stroke="#555"/>';c.forEach((v,i)=>{const bw=W/bins-4,bh=H*v/mx,x=48+i*W/bins,y=300-bh;h+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="#426f91" opacity=".82"/><text x="${x+bw/2}" y="320" text-anchor="middle" fill="#333" font-size="11">${(min+i*w).toFixed(1)}</text>`});svg.innerHTML=h;metrics.innerHTML=[["n",n],["mean",mean.toFixed(3)],["median",med.toFixed(3)],["SD",sd.toFixed(3)],["IQR",iqr.toFixed(3)],["outliers",out.length]].map(x=>`<div class="metric"><strong>${x[0]}</strong><br>${x[1]}</div>`).join('');rep.textContent=`Sorted data: ${a.join(', ')}\nQ1=${q1.toFixed(3)} · Q3=${q3.toFixed(3)}\nFences: ${lo.toFixed(3)} to ${hi.toFixed(3)}\nPotential outliers: ${out.length?out.join(', '):'none'}\n\nInterpret center and spread in the variable's units.`}$("analyze").onclick=analyze;$("normalPreset").onclick=()=>{$("dataInput").value='42,45,47,48,49,50,50,51,52,53,55,58';analyze()};$("skewPreset").onclick=()=>{$("dataInput").value='2,3,3,4,4,5,5,6,8,12,18,30';analyze()};$("outlierPreset").onclick=()=>{$("dataInput").value='10,11,11,12,12,13,13,14,14,15,16,45';analyze()};$("themeToggle").onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';analyze()})();</script></body></html>
